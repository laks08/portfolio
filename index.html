    <title>Lakshya Gupta</title>
    <!--
      Set the theme class before first paint so dark-mode visitors don't see
      a light->dark flash. Mirrors ThemeContext's getInitialIsDark(), and
      must be kept in sync with it if that logic ever changes.
    -->
    <script>
      (function () {
        try {
          var saved = window.localStorage.getItem("theme");
          var isDark =
            saved === "dark" ||
            (saved !== "light" &&
              !window.matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.classList.toggle("dark", isDark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
